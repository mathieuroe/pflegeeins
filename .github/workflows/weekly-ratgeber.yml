name: Wöchentlicher Ratgeber-Artikel

on:
  schedule:
    # Jeden Samstag um 7:00 Uhr UTC (= 9:00 Uhr CEST)
    - cron: "0 7 * * 6"
  # Manuell auslösbar (für Tests)
  workflow_dispatch:

jobs:
  generate-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Artikel generieren
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/generate-article.mjs

      - name: Änderungen committen und pushen
        run: |
          git config user.name "liva-artikel-bot"
          git config user.email "bot@liva-pflege.de"
          git add src/lib/ratgeber-data.ts
          if git diff --staged --quiet; then
            echo "Keine Änderungen – kein Commit nötig."
          else
            git commit -m "feat(ratgeber): neuer Artikel automatisch generiert [skip ci]"
            git push
          fi
